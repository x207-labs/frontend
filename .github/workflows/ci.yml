name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # The dashboard imports `@x207/core` (the join deposit, the limits, the templates of the listing form). `@x207/core` is not published, so the job runs at the
    # umbrella workspace with `npm ci` and the lockfile of the umbrella, and builds `@x207/core` before the lint, the build and the tests (see the workflow file).
    uses: x207-labs/x207/.github/workflows/ci-node-workspace.yml@ce9eb3772f676392c6c168c995afdfa3a53456d3 # OP-001
    with:
      path: frontend
      package: "@x207/frontend"
      build-first: "@x207/core"
    secrets:
      checkout-token: ${{ secrets.X207_CHECKOUT_TOKEN }}
